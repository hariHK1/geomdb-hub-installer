user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Redact nilai token= dari query string di access log.
    # $arg_token kosong → log request apa adanya.
    # $arg_token ada → ganti baris request dengan URI tanpa query string
    # (daripada bocorkan token ArcGIS ke log yang mungkin di-ship ke SIEM).
    map $arg_token $log_request {
        ""      '$request';
        default '$request_method $uri?[query_redacted] $server_protocol';
    }

    log_format main '$remote_addr - [$time_local] "$log_request" '
                    '$status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    server_tokens       off;

    # ─── Kompresi ─────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1000;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/xml application/xml application/json
        application/javascript text/javascript application/rss+xml
        application/wasm image/svg+xml font/woff font/woff2
        application/vnd.ms-fontobject application/x-font-ttf;

    # ─── Rate limiting ────────────────────────────────────────────────────────
    # Harvester resmi Ina-Geoportal (BIG) mengidentifikasi diri lewat User-Agent
    # tetap ini — key kosong bikin nginx tidak membatasi request-nya sama sekali,
    # supaya full re-harvest (paging cepat) tidak kena 429. Ini bukan kontrol
    # keamanan (User-Agent gampang dipalsukan) — cuma pengecualian rate limit
    # untuk klien tepercaya yang dikenal.
    map $http_user_agent $csw_limit_key {
        default                            $binary_remote_addr;
        "~*^Ina-Geoportal-Harvester/"      "";
    }

    # CSW: harvester biasanya tiap 1-6 jam, burst untuk retry wajar
    limit_req_zone $csw_limit_key zone=csw:10m  rate=20r/m;
    # API umum: pengguna aktif + burst normal
    limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/m;
    # Login: lindungi dari brute force
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    limit_req_status 429;

    # ─── SSL session cache (shared antar worker) ──────────────────────────────
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/conf.d/*.conf;
}
