# ─── HTTPS server ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;

    # Ganti dengan domain instansi, contoh:
    #   server_name metadata.kotacontoh.go.id;
    #   server_name *.big.go.id big.go.id;   ← wildcard
    server_name _;

    # ─── Sertifikat ────────────────────────────────────────────────────────────
    # cert.pem  = fullchain (cert + intermediate CA + root CA digabung)
    # key.pem   = private key dari instansi / CA
    # chain.pem = intermediate + root saja (untuk OCSP stapling)
    #
    # Cara install sertifikat komersial (DigiCert/GeoTrust/BSrE):
    #   bash scripts/install-cert-commercial.sh
    ssl_certificate      /etc/nginx/certs/cert.pem;
    ssl_certificate_key  /etc/nginx/certs/key.pem;

    # Chain terpisah untuk OCSP stapling (tanpa cert domain)
    # Diisi saat pakai sertifikat dari CA komersial
    # ssl_trusted_certificate /etc/nginx/certs/chain.pem;

    # ─── TLS modern (Mozilla Modern profile) ───────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_dhparam               /etc/nginx/certs/dhparam.pem;

    # ─── Session ───────────────────────────────────────────────────────────────
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ─── OCSP Stapling ─────────────────────────────────────────────────────────
    # Aktif untuk sertifikat dari CA komersial (DigiCert, GeoTrust, BSrE, dll.)
    # Nonaktifkan untuk self-signed (ssl_stapling off;)
    ssl_stapling        on;
    ssl_stapling_verify on;
    # DNS resolver — pakai resolver instansi jika tersedia
    resolver            8.8.8.8 8.8.4.4 1.1.1.1 valid=300s;
    resolver_timeout    5s;

    # ─── Security headers ──────────────────────────────────────────────────────
    # HSTS: browser wajib HTTPS selama 2 tahun, termasuk subdomain
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           SAMEORIGIN          always;
    add_header X-Content-Type-Options    nosniff             always;
    add_header X-XSS-Protection          "1; mode=block"     always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;

    # ─── Content-Security-Policy dengan NONCE per-request ──────────────────────
    # Hardening: hilangkan 'unsafe-inline' dari script-src. nginx menstempel nonce
    # ke setiap <script> via sub_filter (lihat location /), lalu CSP memakai nonce
    # yang sama. Ini bekerja walau halaman Next di-prerender STATIS (nonce ada di
    # lapisan proxy per-request, bukan di Next) — solusi yang nonce-di-app gagal.
    #
    # $request_id = 16 byte acak unik per-request → dipakai sebagai nonce.
    # proxy_hide_header membuang CSP statis dari app (Next) agar tak duplikat;
    # nginx yang menetapkan CSP. Halaman PDF QC/QE punya location sendiri di bawah
    # (butuh frame-ancestors 'self' untuk embed iframe internal).
    #
    # Catatan: 'style-src unsafe-inline' tetap (atribut style={} tak bisa di-nonce).
    proxy_hide_header Content-Security-Policy;
    # CATATAN: TANPA 'strict-dynamic' — dengan strict-dynamic, 'self' diabaikan &
    # chunk Next/Turbopack tak ber-nonce ke-blokir (terbukti memecah login). Tanpa
    # strict-dynamic: chunk eksternal lewat 'self', inline lewat nonce → jalan.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss:; worker-src 'self' blob:; media-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

    # Upload QC/QA: shapefile, GeoTIFF, PDF bisa besar
    client_max_body_size 100m;

    # ─── CSW endpoint ──────────────────────────────────────────────────────────
    location /csw {
        limit_req zone=csw burst=30 nodelay;

        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout      120s;
        proxy_send_timeout      60s;
        proxy_buffer_size       256k;
        proxy_buffers           8 256k;
        proxy_busy_buffers_size 512k;
    }

    # ─── Public API — cacheable oleh browser & CDN ───────────────────────────
    # Data publik read-only: metadata, standar, referensi, stats
    location ~* ^/(api/public/|api/standar/|api/dokumentasi/) {
        limit_req zone=api burst=80 nodelay;

        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Cache di browser 60 detik, CDN boleh cache lebih lama
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=300" always;
        proxy_read_timeout 30s;
    }

    # ─── Next.js static assets — cache 1 tahun (immutable, punya hash) ────────
    location /_next/static/ {
        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ─── Admin sync (timeout panjang untuk dataset besar) ─────────────────────
    location /api/admin/csw/sync {
        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ─── Login — brute force protection ───────────────────────────────────────
    location /api/auth/login {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── PDF QC/QE — boleh di-embed iframe internal (frame-ancestors 'self') ──
    # Regex → diprioritaskan di atas prefix /api/. CSP khusus dgn frame-ancestors
    # 'self' menggantikan CSP server (frame-ancestors 'none') agar preview PDF
    # internal tidak terblokir. add_header sendiri → re-deklarasi header keamanan.
    location ~ ^/api/metadata/[^/]+/qcqe/pdf$ {
        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_hide_header  Content-Security-Policy;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    nosniff always;
        add_header X-Frame-Options           SAMEORIGIN always;
        add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; object-src 'none'; frame-ancestors 'self'; upgrade-insecure-requests" always;

        proxy_read_timeout 30s;
    }

    # ─── API umum ─────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=80 nodelay;

        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }

    # ─── Block script/exploit probing ─────────────────────────────────────────
    # Tutup koneksi tanpa respons (444) untuk path mencurigakan.
    # Ini melindungi dari scanner otomatis yang mencari WordPress, shell, dll.
    location ~* \.(php|php5|php7|phtml|asp|aspx|cgi|sh|py|pl|rb|jsp|cfm)$ {
        return 444;
    }
    location ~* ^/(wp-login|wp-admin|wp-includes|xmlrpc|phpmyadmin|pma|myadmin|mysqladmin|adminer|shell|backdoor|eval|base64|webshell|c99|r57|alfa) {
        return 444;
    }
    location ~* /(\.git|\.env|\.htaccess|\.htpasswd|web\.config|composer\.(json|lock)|package\.json|yarn\.lock) {
        return 444;
    }

    # ─── Next.js app ──────────────────────────────────────────────────────────
    location / {
        # Blok probe Server Action: aplikasi ini TIDAK memakai Server Action
        # (semua via API route /api/*), jadi request ber-header Next-Action pasti
        # dari bot/scanner atau cache lama → tolak (cegah error log "Failed to find
        # Server Action"). HAPUS blok ini jika suatu saat mulai memakai Server Action.
        if ($http_next_action) { return 400; }

        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # ─── Injeksi nonce CSP ke setiap <script> di HTML ──────────────────────
        # Kosongkan Accept-Encoding agar upstream (Next) kirim HTML TAK ter-kompres
        # → nginx bisa menstempel nonce, lalu nginx kompres ulang (gzip on di
        # nginx.conf). sub_filter hanya pada text/html (default) → RSC/JSON tak
        # diubah. nonce = $request_id, sama dengan yang di header CSP server.
        # Aman: React meng-escape konten user, jadi '<script' hanya muncul utk
        # tag <script> asli (bukan teks).
        proxy_set_header   Accept-Encoding "";
        sub_filter_once    off;
        sub_filter_types   text/html;
        sub_filter         '<script' '<script nonce="$request_id"';

        proxy_read_timeout 30s;
    }
}
