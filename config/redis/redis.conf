# Redis configuration — Geomdb Hub
appendonly yes
appendfilename "appendonly.aof"

# Batas memori — sesuaikan dengan RAM server
maxmemory 256mb
maxmemory-policy allkeys-lru

# Simpan snapshot setiap 15 menit jika ada perubahan
save 900 1
save 300 10
save 60 10000

# Log level
loglevel notice

# Nonaktifkan bind untuk Docker (listen semua interface)
# bind 127.0.0.1
protected-mode yes

# Password di-inject via --requirepass dari docker-compose command
# agar tidak hardcoded di file config yang bisa ter-commit ke git
