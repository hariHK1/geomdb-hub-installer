# Redis configuration — Geomdb Hub
appendonly yes
appendfilename "appendonly.aof"

# Batas memori — sesuaikan dengan RAM server
maxmemory 512mb
# noeviction wajib untuk BullMQ (job auto-sign tidak boleh di-evict).
# Aman karena semua cache (CSW, captcha, rate-limit, JTI) punya TTL → expire sendiri.
maxmemory-policy noeviction

# Simpan snapshot setiap 15 menit jika ada perubahan
save 900 1
save 300 10
save 60 10000

# Log level
loglevel notice

# Nonaktifkan bind untuk Docker (listen semua interface)
# bind 127.0.0.1
protected-mode yes

# Password di-inject via --requirepass dari docker-compose command
# agar tidak hardcoded di file config yang bisa ter-commit ke git
